# Apply the dev stacks a merge to main touched (core: dev only, BRIEF section 0).
# App code (services/) is lane 2 and doesn't come through here: `./sr deploy` in the
# core, build-deploy.yml with a canary in tier 2.
#
# Role: showrunner-ci-apply-dev. Its trust policy accepts only this repo, the GitHub
# environment `dev`, and this workflow file on refs/heads/main. Its permission boundary
# denies the never-create list, IAM roles without the workload boundary, and writes to
# any state key but dev's. Prod (tier 3) adds environment `prod` with a required
# reviewer.
name: apply

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "tools/ci/**"
      - "tools/build/**"

permissions: {}

concurrency:
  group: apply-dev
  cancel-in-progress: false # never cancel an apply halfway

env:
  CHECKPOINT_DISABLE: "1"
  TF_IN_AUTOMATION: "1"
  AWS_REGION: us-east-1

jobs:
  stacks:
    name: which dev stacks changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.map.outputs.matrix }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: map
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # shared/dev first, then customers (they read shared's SSM outputs).
          matrix=$(git diff --name-only "$BEFORE" "$AFTER" | python3 tools/ci/changed_stacks.py \
            | python3 -c 'import json,sys; s=[x for x in json.load(sys.stdin) if x["stack"].endswith("/dev")]; s.sort(key=lambda x: (not x["stack"].startswith("shared/"), x["stack"])); print(json.dumps(s))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python3 -m json.tool

  apply:
    name: apply ${{ matrix.stack.stack }}
    needs: stacks
    if: needs.stacks.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    environment: dev
    strategy:
      fail-fast: true
      max-parallel: 1 # in order; customer stacks also share the cache's user group
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write # OIDC -> showrunner-ci-apply-dev
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            registry.terraform.io:443
            pypi.org:443
            files.pythonhosted.org:443
            sts.amazonaws.com:443
            sts.us-east-1.amazonaws.com:443
            iam.amazonaws.com:443
            *.us-east-1.amazonaws.com:443
            *.s3.us-east-1.amazonaws.com:443
            *.s3.amazonaws.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/showrunner-ci-apply-dev
          aws-region: us-east-1
          role-session-name: apply-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.5
          enable-cache: false
      - run: tools/ci/install-tools.sh conftest
      - name: plan, policy check, apply
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS_JSON }}
          STACK: ${{ matrix.stack.stack }}
          SPEC: ${{ toJSON(matrix.stack) }}
        run: |
          plan="$RUNNER_TEMP/stack.tfplan"
          tools/tf.sh "$STACK" plan -input=false -lock-timeout=300s -out="$plan"
          dir=$(python3 -c 'import json,os;print(json.loads(os.environ["SPEC"])["dir"])')
          TF_DATA_DIR="$PWD/.terraform-data/${STACK//\//_}" terraform -chdir="$dir" show -json "$plan" > "$RUNNER_TEMP/plan.json"
          conftest test --no-color --policy platform/policy "$RUNNER_TEMP/plan.json"
          rm -f "$RUNNER_TEMP/plan.json"
          tools/tf.sh "$STACK" apply -input=false -lock-timeout=300s "$plan"
