# Lane 2 (app code) for catalog-api, tier 2 (ADR 0016): build the zip once, attest its
# provenance, then deploy that exact zip to every dev customer through its canary (10%
# of requests for 5 minutes, then 100%; rolled back if a rollback alarm fires).
#
# The deploy job installs nothing (the AWS and GitHub CLIs come with the runner) and
# deploys only a zip whose provenance it verified: built by THIS workflow, from this
# repo, on refs/heads/main. The digest it verified is the one Lambda pins the version to.
#
# Role: showrunner-ci-deploy-dev (bootstrap). Its trust policy accepts only this repo,
# the GitHub environment `dev`, and this workflow file on refs/heads/main; its policy
# uploads code, publishes versions, moves alias `live` and reads the rollback alarms,
# nothing else (no Terraform, no IAM).
#
# The deploy job runs only when the repo variable LANE2_DEPLOY is `on`: the role gets
# its alias and alarm permissions from bootstrap, which the owner applies by hand. Until
# then a merge builds and attests, and `./sr deploy catalog-api` deploys.
name: build-deploy

on:
  push:
    branches: [main]
    paths:
      - "services/catalog-api/**"
      - "services/shared/**"
      - "tools/build/**"
      - "tools/deploy/**"
      - "uv.lock"
      - ".github/workflows/build-deploy.yml"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: build and attest catalog-api
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write
    outputs:
      sha256: ${{ steps.zip.outputs.sha256 }}
      customers: ${{ steps.customers.outputs.list }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            pypi.org:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.5
          enable-cache: false
      - name: build (reproducible zip, locked hashes, wheels only)
        id: zip
        run: |
          uv run python tools/build/package.py catalog-api
          sha=$(python3 -c 'import base64,hashlib;print(base64.b64encode(hashlib.sha256(open("build/catalog-api.zip","rb").read()).digest()).decode())')
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "catalog-api.zip CodeSha256 $sha"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/catalog-api.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-api-zip
          path: build/catalog-api.zip
          if-no-files-found: error
          retention-days: 7
      - name: dev customers
        id: customers
        run: |
          list=$(ls platform/customers/*/dev.yaml | cut -d/ -f3 | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read().split()))')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"

  deploy:
    name: canary ${{ matrix.customer }} dev
    needs: build
    if: vars.LANE2_DEPLOY == 'on'
    runs-on: ubuntu-24.04
    environment: dev
    # Same group as that customer's Terraform apply (apply.yml): a canary and an apply
    # of the same stack never overlap (an apply mid-canary would reset the alias).
    concurrency:
      group: apply-customers/${{ matrix.customer }}/dev
      cancel-in-progress: false
    strategy:
      fail-fast: false # one customer's rollback doesn't stop the others' canaries
      matrix:
        customer: ${{ fromJSON(needs.build.outputs.customers) }}
    permissions:
      contents: read
      id-token: write # OIDC -> showrunner-ci-deploy-dev
      attestations: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            tuf-repo-cdn.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            sts.amazonaws.com:443
            sts.us-east-1.amazonaws.com:443
            lambda.us-east-1.amazonaws.com:443
            monitoring.us-east-1.amazonaws.com:443
            ssm.us-east-1.amazonaws.com:443
            *.s3.us-east-1.amazonaws.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-api-zip
          path: build
      - name: verify provenance (this repo, this workflow, main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify build/catalog-api.zip \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-deploy.yml" \
            --source-ref refs/heads/main
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/showrunner-ci-deploy-dev
          aws-region: us-east-1
          role-session-name: deploy-${{ github.run_id }}
      - name: canary (10% for 5 min, then 100%; rolled back by the alarms)
        env:
          CUSTOMER: ${{ matrix.customer }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          python3 tools/deploy/lambda_deploy.py --zip build/catalog-api.zip \
            --env dev --customer "$CUSTOMER" --expect-sha256 "$SHA256"
