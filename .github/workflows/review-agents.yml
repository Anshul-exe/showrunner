# PR review agents (tier 2, Pillar 4): router -> iac-security -> verifier -> one comment.
#
# Three jobs, three trust levels:
#   evidence  runs checkov (third-party code from PyPI): contents:read, no AWS, no write
#   review    holds the OIDC token for showrunner-ci-review-agents (Bedrock invoke on one
#             model + the call counter, nothing else). Installs nothing: system python3
#             and the preinstalled AWS CLI. At most 2 model calls per run, 40 per day.
#   gate      is the check (review/review/gate.py): ALWAYS runs, because GitHub counts a
#             skipped required check as passing; fails closed when the evidence or review
#             job didn't succeed, and on fork PRs ("not reviewed automatically").
#             Installs nothing; AWS only to record an accepted override.
#
# A confirmed HIGH fails the gate. Override: add the label `accept-risk`, write the
# reason in a comment, then "Re-run failed jobs": only the gate re-runs (it reads the
# labels at run time), so an override costs no model calls, and it is written to
# sr-ops-audit (REVIEW#pr-<n>, never overwritten). See docs/adr/0013.
name: review-agents

on:
  pull_request:

permissions: {}

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    name: route + scanner evidence
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      routed: ${{ steps.route.outputs.routed }}
      review: ${{ steps.route.outputs.review }}
      evidence: ${{ steps.ev.outputs.evidence }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            releases.astral.sh:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: route (rules, no AI)
        id: route
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --unified=3 "$BASE"...HEAD > "$RUNNER_TEMP/diff.txt"
          git diff --name-only "$BASE"...HEAD > "$RUNNER_TEMP/paths.txt"
          routed=$(PYTHONPATH=review python3 -m review route < "$RUNNER_TEMP/paths.txt")
          echo "routed=$routed" >> "$GITHUB_OUTPUT"
          jq -r '."iac-security" // [] | .[]' <<< "$routed" > "$RUNNER_TEMP/files.txt"
          if [[ -s "$RUNNER_TEMP/files.txt" ]]; then echo "review=true" >> "$GITHUB_OUTPUT"; else echo "review=false" >> "$GITHUB_OUTPUT"; fi
          echo "routed: $routed"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.route.outputs.review == 'true'
        with:
          version: 0.13.5
          enable-cache: false
      - name: checkov (hash-locked) on the PR head, then evidence E1..En
        id: ev
        if: steps.route.outputs.review == 'true'
        run: |
          uv venv /tmp/lint
          uv pip install --python /tmp/lint --require-hashes -r tools/lint/requirements.txt
          /tmp/lint/bin/checkov -d platform --framework terraform -o json --quiet --skip-download \
            > "$RUNNER_TEMP/checkov.json" || true   # failures are evidence, not a job failure
          PYTHONPATH=review python3 -m review evidence --diff "$RUNNER_TEMP/diff.txt" \
            --checkov "$RUNNER_TEMP/checkov.json" --files "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/evidence.json"
          echo "evidence items: $(jq length "$RUNNER_TEMP/evidence.json")"
          echo "evidence=$(base64 -w0 "$RUNNER_TEMP/evidence.json")" >> "$GITHUB_OUTPUT"

  review:
    name: iac-security + verifier
    needs: evidence
    if: needs.evidence.outputs.review == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      comment: ${{ steps.run.outputs.comment }}
      blocking: ${{ steps.run.outputs.blocking }}
      highs: ${{ steps.run.outputs.highs }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            sts.us-east-1.amazonaws.com:443
            bedrock-runtime.us-east-1.amazonaws.com:443
            dynamodb.us-east-1.amazonaws.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/showrunner-ci-review-agents
          aws-region: us-east-1
          role-session-name: review-pr-${{ github.event.pull_request.number }}
      - name: specialist, then the verifier tries to disprove each finding
        id: run
        env:
          AWS_REGION: us-east-1
          EVIDENCE: ${{ needs.evidence.outputs.evidence }}
          ROUTED: ${{ needs.evidence.outputs.routed }}
        run: |
          base64 -d <<< "$EVIDENCE" > "$RUNNER_TEMP/evidence.json"
          printf '%s' "$ROUTED" > "$RUNNER_TEMP/routed.json"
          rc=0
          PYTHONPATH=review python3 -m review run --evidence "$RUNNER_TEMP/evidence.json" --root . \
            --routed "$RUNNER_TEMP/routed.json" > "$RUNNER_TEMP/result.json" || rc=$?
          [[ $rc -le 1 ]] || exit "$rc"   # 1 = a confirmed high: the gate decides, after commenting
          jq -c '{model_calls, blocking, specialist: .specialist.mode, verifier: .verification.usage.mode,
                  verdicts: [.verification.verdicts[] | {finding, verdict, decided_by}]}' "$RUNNER_TEMP/result.json"
          PYTHONPATH=review python3 -m review comment < "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/comment.md"
          echo "comment=$(base64 -w0 "$RUNNER_TEMP/comment.md")" >> "$GITHUB_OUTPUT"
          echo "blocking=$(jq -r .blocking "$RUNNER_TEMP/result.json")" >> "$GITHUB_OUTPUT"
          echo "highs=$(jq -c .confirmed_high "$RUNNER_TEMP/result.json" | base64 -w0)" >> "$GITHUB_OUTPUT"

  gate:
    name: review-agents gate
    needs: [evidence, review]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            sts.us-east-1.amazonaws.com:443
            dynamodb.us-east-1.amazonaws.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: decide (fail closed)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          REVIEW: ${{ needs.evidence.outputs.review }}
          REVIEW_RESULT: ${{ needs.review.result }}
          COMMENT: ${{ needs.review.outputs.comment }}
          BLOCKING: ${{ needs.review.outputs.blocking }}
          HIGHS: ${{ needs.review.outputs.highs }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          d="$RUNNER_TEMP/gate"; mkdir -p "$d"
          [[ -z "$COMMENT" ]] || base64 -d <<< "$COMMENT" > "$d/review.md"
          [[ -z "$HIGHS" ]] || base64 -d <<< "$HIGHS" > "$d/highs.json"
          if [[ "$FORK" != "true" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" > "$d/labels.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/events" --paginate | jq -s add > "$d/events.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate | jq -s add > "$d/comments.json"
          fi
          PYTHONPATH=review python3 -m review gate --fork "$FORK" --evidence-result "$EVIDENCE_RESULT" \
            --review-needed "$REVIEW" --review-result "$REVIEW_RESULT" --blocking "$BLOCKING" \
            --repo "$GITHUB_REPOSITORY" --pr "$PR" --run-url "$RUN_URL" --out "$d" \
            --review-comment "$d/review.md" --highs "$d/highs.json" \
            --labels "$d/labels.json" --events "$d/events.json" --comments "$d/comments.json"
          echo "record=$(jq -r '.record != null' "$d/decision.json")" >> "$GITHUB_OUTPUT"
          echo "comment=$(jq -r .comment "$d/decision.json")" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.decide.outputs.record == 'true'
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/showrunner-ci-review-agents
          aws-region: us-east-1
          role-session-name: review-gate-pr-${{ github.event.pull_request.number }}
      - name: record the accept-risk override (sr-ops-audit, never overwritten)
        if: steps.decide.outputs.record == 'true'
        env:
          AWS_REGION: us-east-1
        run: PYTHONPATH=review python3 -m review gate-record --dir "$RUNNER_TEMP/gate"
      - name: comment (one per PR, refreshed)
        if: steps.decide.outputs.comment == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            | jq -rs 'add | .[] | select(.body | startswith("<!-- sr-review -->")) | .id' | head -1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/gate/comment.md" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$RUNNER_TEMP/gate/comment.md" >/dev/null
          fi
      - name: pass or fail
        run: |
          jq -r .message "$RUNNER_TEMP/gate/decision.json"
          jq -e .ok "$RUNNER_TEMP/gate/decision.json" > /dev/null
